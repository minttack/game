name: IRL Original Mobile Graphics Source Validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'workers/irl-forest-runtime-evidence-20261022'
  pull_request:
    paths:
      - 'IRL/Tools/Visual/**'
      - 'IRL/Source/IRL/Mobile/**'
      - 'IRL/Tests/test_android_mobile_contract.py'
      - 'IRL/Config/**'
      - 'IRL/Source/IRL/IRLPlayerController.*'
      - 'IRL/Source/IRL/Tests/IRLNativeMobileJoystickTests.cpp'
      - 'IRL/Tests/host_irl_mobile_joystick.cpp'
      - 'IRL/Tests/test_mobile_runtime_joystick_contract.py'
      - 'IRL/Tools/Visual/audit_android_class_chain.py'
      - 'IRL/Tools/Visual/test_android_class_chain_mock.py'
      - '.github/workflows/irl-original-graphics.yml'

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the one IRL source repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original material generator dependencies
        run: python -m pip install numpy pillow
      - name: Validate original source tools
        run: |
          python -m compileall -q IRL/Tools/Visual IRL/Content/Python IRL/Tests
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('IRL/IRL.uproject').read_text())
          required={'PythonScriptPlugin','EditorScriptingUtilities','PythonAutomationTest','FunctionalTestingEditor'}
          actual={x['Name'] for x in p['Plugins'] if x.get('Enabled') and 'Editor' in x.get('TargetAllowList',[])}
          assert p['EngineAssociation']=='5.8' and required<=actual, (required-actual)
          print('PASS required Unreal 5.8 editor-only scripting plugins, game not modified')
          PY
          python IRL/Tools/Visual/test_generated_assets.py
          python IRL/Tools/Visual/test_mobile_capture.py
          python IRL/Tools/Visual/test_forest_collision_gate.py
          python IRL/Tools/Visual/test_forest_world_evidence.py
          python IRL/Tools/Visual/test_forest_pie_evidence.py
          python IRL/Tools/Visual/test_forest_screenshot_evidence.py
          python IRL/Tools/Visual/test_native_forest_runner.py
          python IRL/Tools/Visual/test_android_apk_runner.py
          python IRL/Tests/test_android_mobile_contract.py
          python IRL/Tests/test_mobile_runtime_joystick_contract.py
          python IRL/Tools/Visual/test_android_class_chain_mock.py
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I IRL/Source/IRL/Mobile IRL/Tests/host_irl_mobile_joystick.cpp -o /tmp/irl-mobile-joystick
          /tmp/irl-mobile-joystick
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -I IRL/Source/IRL/Mobile IRL/Tests/host_irl_mobile_joystick.cpp -o /tmp/irl-mobile-joystick-ubsan
          /tmp/irl-mobile-joystick-ubsan
          python IRL/Tools/Visual/test_probe_unreal_forest_mock.py
          python IRL/Tools/Visual/test_scene_plan.py
          python IRL/Tools/Visual/test_editor_scene_builder.py
      - name: Generate a reproducible original starter asset pack
        run: |
          python IRL/Tools/Visual/generate_irl_showcase.py --size 512 --seed 20261022 --out IRL/Tools/Visual/Generated
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          folder=Path('IRL/Tools/Visual/Generated')
          m=json.loads((folder/'IRL_Original_PBR_Manifest.json').read_text())
          assert len(m['sha256']) == 16
          for name, wanted in m['sha256'].items():
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest() == wanted, name
          print('PASS IRL original PBR manifest validation:',len(m['sha256']),'assets')
          PY
      - name: Attach original IRL test assets for Unreal Editor import
        uses: actions/upload-artifact@v4
        with:
          name: IRL-Original-Mobile-PBR-Source-512
          path: IRL/Tools/Visual/Generated/
          retention-days: 14
