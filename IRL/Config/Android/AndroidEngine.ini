; IRL Android-first mobile renderer, source-verified configuration candidate.
; This platform-specific file must not change the desktop Unreal scene.
; Unreal 5.8: mobile forward path 0; desktop Lumen/VSM/RT require far more GPU.
; Phone compatibility and actual rendering require a real Unreal Android cook.
[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.RayTracing=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False
r.GenerateMeshDistanceFields=False
r.Substrate=False
r.MobileHDR=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False

[SystemSettings]
; Runtime/mobile-only post-processing budget. BIE BLOOM cognition has
; nothing to do with the GPU post-process bloom effect.
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.VolumetricFog=0
